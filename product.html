<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Luviio</title>
  
  <link rel="stylesheet" href="/css/luviio.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8360942174797973" crossorigin="anonymous"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <style>
    /* ── LAYOUT (Clean Grid, No Fractional Clutter) ── */
    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1.1fr; 
      gap: 72px;
      padding: 16px 0 80px;
      align-items: start;
    }
    
    /* Breadcrumb */
    .breadcrumb {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 40px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden;
    }
    .breadcrumb a { color: var(--text-dim); text-decoration: none; transition: color 0.3s; display: flex; align-items: center; gap: 6px; }
    .breadcrumb a:hover { color: var(--gold); }
    .breadcrumb i.sep { font-size: 16px; color: var(--border); }
    .bc-current { color: var(--gold); overflow: hidden; text-overflow: ellipsis; max-width: 250px; display: inline-block; vertical-align: bottom; }
    
    /* ── GALLERY ── */
    .product-gallery-wrap { display: flex; flex-direction: column; position: sticky; top: 110px; }
    
    .carousel-container {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
      aspect-ratio: 1 / 1; background: var(--surface-2); border-radius: 24px;
      border: 1px solid var(--border); position: relative; width: 100%;
    }
    .carousel-container::-webkit-scrollbar { display: none; }
    
    .carousel-slide {
      flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
    
    .carousel-dots { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
    .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.3s; cursor: pointer; }
    .carousel-dot.active { background: var(--gold); transform: scale(1.4); }
    
    .product-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 80px; color: var(--border); }
    
    .product-badge-oos {
      position: absolute; top: 24px; left: 24px; background: var(--error); color: #fff;
      font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 8px 18px; border-radius: 30px; z-index: 10; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 20px rgba(224, 82, 82, 0.3);
    }
    
    /* ── PRODUCT INFO ── */
    .product-info { display: flex; flex-direction: column; gap: 24px; }
    
    .product-category { font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 8px; }
    
    .product-title {
      font-family: 'Playfair Display', serif; font-size: clamp(32px, 4vw, 46px);
      font-weight: 700; line-height: 1.15; margin: 0; color: var(--text); letter-spacing: -0.5px;
    }
    
    .product-price-row { display: flex; align-items: baseline; gap: 16px; margin-top: 8px; }
    .product-price { font-size: 36px; font-weight: 700; color: var(--text); letter-spacing: -1px; }
    .product-compare { font-size: 20px; color: var(--text-muted); text-decoration: line-through; font-weight: 500; }
    
    /* ── 🔥 CART CONTROLS (STRICT SIDE-BY-SIDE FIXED) ── */
    .add-to-cart-section {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap; /* Prevents stacking entirely */
      gap: 16px;
      margin-top: 16px;
      width: 100%;
      align-items: stretch;
    }
    
    .qty-control {
      flex: 0 0 130px; /* Strictly 130px wide, won't shrink */
      width: 130px;
      display: flex; 
      align-items: center; 
      border: 1px solid var(--border);
      border-radius: 14px; 
      background: var(--surface-2); 
      height: 60px; 
      overflow: hidden; 
      transition: border-color 0.3s;
    }
    .qty-control:focus-within { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201,165,94,0.2); }
    
    .qty-btn {
      width: 40px; height: 100%; background: none; border: none; color: var(--text);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 20px;
      flex-shrink: 0;
    }
    .qty-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); color: var(--gold); }
    
    /* Input hack to remove selectors entirely on all devices */
    .qty-input-field {
      flex: 1; height: 100%; width: 100%; min-width: 0; text-align: center;
      background: none; border: none; color: var(--text); font-size: 18px; font-weight: 700; outline: none;
    }
    
    .btn-add-cart {
      flex: 1; /* Takes the remaining space smoothly */
      min-width: 0; /* Prevents overflow */
      height: 60px; background: var(--gold); color: #080808; border: none; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s; gap: 8px;
      box-shadow: 0 8px 25px rgba(201, 169, 110, 0.25);
    }
    .btn-add-cart:hover:not(:disabled) { background: #b59454; transform: translateY(-3px); box-shadow: 0 12px 30px rgba(201, 169, 110, 0.35); }
    .btn-add-cart:active:not(:disabled) { transform: translateY(0); box-shadow: 0 4px 15px rgba(201, 169, 110, 0.2); }
    
    /* Strict OOS Button State */
    .add-to-cart-section.is-oos .btn-add-cart {
      flex: 1; width: 100%;
      background: var(--surface-2); color: var(--text-dim); box-shadow: none; cursor: not-allowed; border: 1px solid var(--border);
    }
    .add-to-cart-section.is-oos .btn-add-cart:hover { transform: none; box-shadow: none; background: var(--surface-2); }
    
    /* CSS Spinner */
    .custom-spinner {
      width: 24px; height: 24px; border: 3px solid rgba(8, 8, 8, 0.2);
      border-top-color: #080808; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ── ACCORDION & META ── */
    .product-accordion { border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); margin-top: 32px; }
    .accordion-header {
      display: flex; justify-content: space-between; align-items: center; padding: 24px 0; cursor: pointer;
      font-weight: 700; font-size: 14px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; user-select: none; transition: color 0.3s;
    }
    .accordion-header:hover { color: var(--gold); }
    .accordion-icon { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; color: var(--gold); font-size: 24px; }
    .accordion-header.active .accordion-icon { transform: rotate(180deg); }
    .accordion-content-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .accordion-header.active + .accordion-content-wrap { grid-template-rows: 1fr; }
    .accordion-content { overflow: hidden; }
    .accordion-inner { padding-bottom: 32px; font-size: 15px; color: var(--text-muted); line-height: 1.8; white-space: pre-line; }
    
    .product-meta {
      display: flex; flex-direction: column; gap: 16px; margin-top: 24px; padding: 24px;
      background: var(--surface-2); border-radius: 16px; border: 1px solid var(--border);
    }
    .product-meta-row { display: flex; gap: 16px; font-size: 14px; align-items: baseline; }
    .product-meta-label { color: var(--text-muted); min-width: 120px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
    .product-meta-value { color: var(--text); font-weight: 500; line-height: 1.5; }
    
    /* ── STOCK BAR ── */
    .stock-bar-wrap { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .stock-bar-track { height: 6px; background: var(--surface-2); border: 1px inset var(--border); border-radius: 6px; overflow: hidden; }
    .stock-bar-fill { height: 100%; border-radius: 6px; width: 0%; transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .stock-label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .stock-label.ok { color: #22c55e; }
    .stock-label.low { color: var(--gold); }
    .stock-label.oos { color: var(--error); }
    
    /* Empty states */
    .empty-state { text-align: center; padding: 100px 20px; background: var(--surface); border-radius: 24px; border: 1px dashed var(--border); grid-column: 1/-1; }
    .empty-state-icon { font-size: 72px; color: var(--border-light); margin-bottom: 24px; }
    
    /* Strict Mobile Responsiveness */
    @media (max-width: 900px) {
      .product-layout {
        display: flex;
        flex-direction: column;
        gap: 40px;
        padding: 0 0 80px;
      }
      .product-gallery-wrap { position: static; width: 100%; }
      .carousel-container { border-radius: 20px; aspect-ratio: 1 / 1; min-height: auto; }
      .product-title { font-size: 32px; }
    }
  </style>
</head>

<body class="bg-[#080808] text-[#f0ece4] font-body antialiased selection:bg-gold selection:text-black">
  
  <div class="fixed inset-0 z-[9996] pointer-events-none opacity-[0.028]" style="background-image:url('data:image/svg+xml,%3Csvg viewBox=%270 0 256 256%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27noise%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.9%27 numOctaves=%274%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23noise)%27/%3E%3C/svg%3E');background-size:200px"></div>
  
  <nav id="main-nav"></nav>
  
  <div class="page-wrapper relative z-10">
    <div class="container pt-8 pb-24 max-w-[1200px] mx-auto">
      
      <nav class="breadcrumb" id="product-breadcrumb" style="opacity: 0;">
        <a href="/index.html"><i class="ri-home-4-line text-lg"></i> Home</a><i class="ri-arrow-right-s-line sep"></i>
        <a href="/shop.html"><i class="ri-store-2-line text-lg"></i> Shop</a><i class="ri-arrow-right-s-line sep"></i>
        <span class="bc-current" id="bc-name">Loading...</span>
      </nav>
      
      <div id="product-layout" class="product-layout">
        <!-- Exact Mirror Skeleton Loaders -->
        <div class="skeleton" style="width: 100%; aspect-ratio: 1/1; border-radius: 24px;"></div>
        <div style="display: flex; flex-direction: column; gap: 24px; padding-top: 16px;">
          <div class="skeleton" style="height: 16px; width: 120px; border-radius: 4px;"></div>
          <div class="skeleton" style="height: 48px; width: 90%; border-radius: 8px;"></div>
          <div class="skeleton" style="height: 36px; width: 160px; border-radius: 8px;"></div>
          <div class="skeleton" style="height: 1px; width: 100%; margin: 8px 0; background: var(--border);"></div>
          <div class="skeleton" style="height: 60px; width: 100%; border-radius: 14px;"></div>
          <div class="skeleton" style="height: 120px; width: 100%; border-radius: 14px; margin-top: 16px;"></div>
        </div>
      </div>
      
    </div>
    
    <footer class="site-footer">
      <div class="container max-w-[1200px] mx-auto">
        <div class="footer-bottom" style="border-top: 1px solid var(--border); margin-top:0; padding-top: 32px;">
          <span style="color: var(--gold); font-size: 13px; font-weight: bold; letter-spacing: 2px;">© 2026 LUVIIO</span>
          <a href="/shop.html" style="color: var(--text); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color 0.3s;"><i class="ri-arrow-left-line text-lg"></i> Return to Shop</a>
        </div>
      </div>
    </footer>
  </div>
  
  <script src="/js/keys.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/push.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    let product = null;
    
    pageInit();
    
    gsap.to("#product-breadcrumb", { opacity: 1, duration: 0.8, ease: "power2.out", delay: 0.1 });
    
    const slug = getParam('slug');
    if (!slug) { window.location.href = '/shop.html'; }
    else { loadProduct(slug); }
    
    async function loadProduct(slug) {
      try {
        product = await API.getProduct(slug);
        renderProduct(product);
      } catch (err) {
        document.getElementById('product-layout').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i class="ri-error-warning-line text-error"></i></div>
            <h3 style="font-family: var(--font-display); font-size:28px; margin-bottom:12px;">Product Not Found</h3>
            <p style="color:var(--text-muted); margin-bottom:32px;">${escapeHTML(err.message)}</p>
            <a href="/shop.html" class="btn btn-outline" style="padding: 14px 32px; border-radius:12px; text-decoration:none; display:inline-flex; align-items:center; gap:8px;"><i class="ri-store-2-line"></i> Return to Shop</a>
          </div>`;
      }
    }
    
    function renderProduct(p) {
      document.title = `${p.name} — Luviio`;
      document.getElementById('bc-name').textContent = p.name;
      
      let canonicalUrl = window.location.origin + window.location.pathname + "?slug=" + slug;
      let linkTag = document.querySelector("link[rel='canonical']");
      if (!linkTag) {
        linkTag = document.createElement('link');
        linkTag.setAttribute('rel', 'canonical');
        document.head.appendChild(linkTag);
      }
      linkTag.setAttribute('href', canonicalUrl);
      
      let metaDesc = document.querySelector("meta[name='description']");
      if (!metaDesc) {
        metaDesc = document.createElement('meta');
        metaDesc.setAttribute('name', 'description');
        document.head.appendChild(metaDesc);
      }
      metaDesc.setAttribute('content', p.short_description || p.description || `Buy ${p.name} at Luviio.`);
      
      const layout = document.getElementById('product-layout');
      
      // 🔥 BULLETPROOF OOS LOGIC FIX 🔥
      // Even if API sends garbage string or null, it parses correctly. 
      // If in_stock flag explicitly says false, it's dead OOS regardless of stock count.
      const maxStock = parseInt(p.stock) || 0;
      const isOOS = (p.in_stock === false) || (maxStock === 0);
      
      layout.innerHTML = '';
      
      const images = p.images && p.images.length > 0 ? p.images : (p.image_url ? [p.image_url] : []);
      
      // ── Image Gallery ─────────────────────────────────────────────────
      const imgSec = document.createElement('div');
      imgSec.className = 'gsap-img-sec';
      const galleryWrap = document.createElement('div');
      galleryWrap.className = 'product-gallery-wrap';
      
      const carouselContainer = document.createElement('div');
      carouselContainer.className = 'carousel-container';
      
      if (images.length > 0) {
        images.forEach((imgUrl) => {
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          const img = document.createElement('img');
          img.src = escapeHTML(imgUrl);
          img.alt = `${escapeHTML(p.name)}`;
          slide.appendChild(img);
          carouselContainer.appendChild(slide);
        });
      } else {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        const ph = document.createElement('div');
        ph.className = 'product-img-placeholder';
        ph.innerHTML = '<i class="ri-image-line"></i>';
        slide.appendChild(ph);
        carouselContainer.appendChild(slide);
      }
      
      galleryWrap.appendChild(carouselContainer);
      
      // 🔥 OOS Badge attached to Wrap (Fixes scrolling bug)
      if (isOOS) {
        const badge = document.createElement('div');
        badge.className = 'product-badge-oos';
        badge.innerHTML = '<i class="ri-forbid-2-line text-lg"></i> Sold Out';
        galleryWrap.appendChild(badge);
      }
      
      if (images.length > 1) {
        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'carousel-dots';
        const dots = [];
        images.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
          dotsWrap.appendChild(dot);
          dots.push(dot);
        });
        carouselContainer.addEventListener('scroll', () => {
          const idx = Math.round(carouselContainer.scrollLeft / carouselContainer.clientWidth);
          dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        });
        galleryWrap.appendChild(dotsWrap);
      }
      
      imgSec.appendChild(galleryWrap);
      
      // ── Info Section ───────────────────────────────────────────────────
      const info = document.createElement('div');
      info.className = 'product-info gsap-info-sec';
      
      if (p.categories?.name) {
        const cat = document.createElement('div');
        cat.className = 'product-category gsap-item';
        cat.innerHTML = `<i class="ri-price-tag-3-line"></i> ${escapeHTML(p.categories.name)}`;
        info.appendChild(cat);
      }
      
      const title = document.createElement('h1');
      title.className = 'product-title gsap-item';
      title.textContent = p.name;
      info.appendChild(title);
      
      const priceRow = document.createElement('div');
      priceRow.className = 'product-price-row gsap-item';
      const priceEl = document.createElement('div');
      priceEl.className = 'product-price';
      priceEl.textContent = formatPrice(p.price);
      priceRow.appendChild(priceEl);
      if (p.compare_price) {
        const cmp = document.createElement('div');
        cmp.className = 'product-compare';
        cmp.textContent = formatPrice(p.compare_price);
        priceRow.appendChild(cmp);
      }
      info.appendChild(priceRow);
      
      // 🔥 Bulletproof Stock Indicator Call
      const stockInfo = buildStockIndicator(maxStock, p.low_stock_threshold || 10, isOOS);
      stockInfo.wrapper.className += ' gsap-item';
      info.appendChild(stockInfo.wrapper);
      
      // ── Add to Cart (Strict Side-by-Side Grid) ───────────────────
      const addSec = document.createElement('div');
      addSec.className = 'add-to-cart-section gsap-item' + (isOOS ? ' is-oos' : '');
      
      if (isOOS) {
        // 🔥 If OOS, show NO selectors. Just a full-width disabled button.
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add-cart btn-oos';
        addBtn.innerHTML = '<i class="ri-forbid-2-line text-xl"></i> Sold Out';
        addBtn.disabled = true;
        addSec.appendChild(addBtn);
      } else {
        const qtyCtrl = document.createElement('div');
        qtyCtrl.className = 'qty-control';
        
        const qtyMinus = document.createElement('button');
        qtyMinus.className = 'qty-btn';
        qtyMinus.innerHTML = '<i class="ri-subtract-line"></i>';
        
        // 🔥 MAGIC TRICK: type="text" + inputMode removes ALL browser spinners completely
        const qtyInput = document.createElement('input');
        qtyInput.type = 'text';
        qtyInput.inputMode = 'numeric';
        qtyInput.pattern = '[0-9]*';
        qtyInput.className = 'qty-input-field';
        qtyInput.value = '1';
        
        const qtyPlus = document.createElement('button');
        qtyPlus.className = 'qty-btn';
        qtyPlus.innerHTML = '<i class="ri-add-line"></i>';
        
        qtyMinus.addEventListener('click', () => {
          let v = parseInt(qtyInput.value) || 1;
          if (v > 1) qtyInput.value = v - 1;
        });
        
        qtyPlus.addEventListener('click', () => {
          let v = parseInt(qtyInput.value) || 1;
          if (!maxStock || v < maxStock) {
            qtyInput.value = v + 1;
          } else {
            showToast(`Only ${maxStock} units left in stock`, 'warn');
          }
        });
        
        qtyInput.addEventListener('change', () => {
          let v = parseInt(qtyInput.value);
          if (isNaN(v) || v < 1) v = 1;
          if (maxStock && v > maxStock) {
            v = maxStock;
            showToast(`Max stock is ${maxStock}`, 'warn');
          }
          qtyInput.value = v;
        });
        
        qtyCtrl.appendChild(qtyMinus);
        qtyCtrl.appendChild(qtyInput);
        qtyCtrl.appendChild(qtyPlus);
        addSec.appendChild(qtyCtrl);
        
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add-cart';
        addBtn.innerHTML = '<i class="ri-shopping-cart-2-line text-xl"></i> Add to Cart';
        
        addBtn.addEventListener('click', async () => {
          if (addBtn.disabled) return;
          
          if (typeof AUTH !== 'undefined' && !AUTH.isLoggedIn()) {
            showToast('Please sign in to add items', 'warn');
            setTimeout(() => window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`, 1200);
            return;
          }
          
          const ogHtml = '<i class="ri-shopping-cart-2-line text-xl"></i> Add to Cart';
          const finalQty = parseInt(qtyInput.value) || 1;
          
          addBtn.disabled = true;
          addBtn.innerHTML = '<div class="custom-spinner" style="border-top-color: #080808; border-color: rgba(8,8,8,0.2);"></div>';
          
          try {
            await API.addCartItem(p.id, finalQty);
            showToast(`${finalQty}x ${p.name} added`, 'success');
            
            addBtn.innerHTML = '<i class="ri-check-line text-xl"></i> Added to Cart';
            addBtn.style.background = '#22c55e';
            addBtn.style.color = '#fff';
            
            await updateCartBadge();
            
            setTimeout(() => {
              addBtn.innerHTML = ogHtml;
              addBtn.style.background = '';
              addBtn.style.color = '';
              addBtn.disabled = false;
            }, 2000);
            
          } catch (err) {
            console.error('Cart error:', err);
            showToast(err.message || 'Failed to add item', 'error');
            addBtn.innerHTML = ogHtml;
            addBtn.disabled = false;
          }
        });
        
        addSec.appendChild(addBtn);
      }
      
      info.appendChild(addSec);
      
      // ── Collapsible Description ────────────────────────────────────────
      if (p.description || p.short_description) {
        const accordion = document.createElement('div');
        accordion.className = 'product-accordion gsap-item';
        const header = document.createElement('div');
        header.className = 'accordion-header';
        header.innerHTML = `<span style="display:flex; align-items:center; gap:8px;"><i class="ri-file-text-line text-lg"></i> Product Details</span><span class="accordion-icon"><i class="ri-arrow-down-s-line"></i></span>`;
        const contentWrap = document.createElement('div');
        contentWrap.className = 'accordion-content-wrap';
        const content = document.createElement('div');
        content.className = 'accordion-content';
        const inner = document.createElement('div');
        inner.className = 'accordion-inner';
        inner.textContent = p.description || p.short_description;
        
        content.appendChild(inner);
        contentWrap.appendChild(content);
        accordion.appendChild(header);
        accordion.appendChild(contentWrap);
        
        header.addEventListener('click', () => header.classList.toggle('active'));
        info.appendChild(accordion);
      }
      
      // ── Meta Data Attributes ──────────────────────────────
      const attrKeys = p.attributes ? Object.keys(p.attributes) : [];
      if (p.sku || p.weight_grams || attrKeys.length > 0) {
        const meta = document.createElement('div');
        meta.className = 'product-meta gsap-item';
        
        const addMeta = (label, val) => {
          const row = document.createElement('div');
          row.className = 'product-meta-row';
          row.innerHTML = `<span class="product-meta-label">${escapeHTML(label)}</span><span class="product-meta-value">${escapeHTML(val)}</span>`;
          meta.appendChild(row);
        };
        
        if (p.sku) addMeta('SKU', p.sku);
        if (p.weight_grams) addMeta('Weight', `${p.weight_grams}g`);
        
        attrKeys.forEach(k => {
          if (p.attributes[k]) addMeta(k, p.attributes[k]);
        });
        
        info.appendChild(meta);
      }
      
      layout.appendChild(imgSec);
      layout.appendChild(info);
      
      gsap.fromTo(".gsap-img-sec", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" });
      gsap.fromTo(".gsap-item", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.06, ease: "power2.out", delay: 0.1 });
      
      if (stockInfo.fillElement && stockInfo.targetWidth && !isOOS) {
        gsap.fromTo(stockInfo.fillElement, { width: "0%" }, { width: stockInfo.targetWidth, duration: 1.2, ease: "power3.out", delay: 0.5 });
      }
    }
    
    // ── Stock Indicator (FIXED OOS LOGIC) ──────────────────────────────
    function buildStockIndicator(stock, threshold, isOOS) {
      const wrap = document.createElement('div');
      wrap.className = 'stock-bar-wrap';
      const label = document.createElement('div');
      label.className = 'stock-label';
      const track = document.createElement('div');
      track.className = 'stock-bar-track';
      const fill = document.createElement('div');
      fill.className = 'stock-bar-fill';
      let targetWidth = "0%";
      
      if (isOOS) {
        label.className += ' oos';
        label.innerHTML = '<i class="ri-forbid-2-line text-lg"></i> Out of stock';
        fill.style.background = 'var(--error)';
      } else if (stock <= 3) {
        label.className += ' low';
        label.innerHTML = `<i class="ri-error-warning-line text-lg"></i> Only ${stock} left — order soon!`;
        targetWidth = `${Math.min(stock / threshold * 100, 100)}%`;
        fill.style.background = 'var(--error)';
      } else if (stock <= threshold) {
        label.className += ' low';
        label.innerHTML = `<i class="ri-error-warning-line text-lg"></i> Low stock — ${stock} remaining`;
        targetWidth = `${Math.min(stock / threshold * 100, 100)}%`;
        fill.style.background = 'var(--gold)';
      } else {
        label.className += ' ok';
        label.innerHTML = '<i class="ri-checkbox-circle-line text-lg"></i> In stock & ready to ship';
        targetWidth = '100%';
        fill.style.background = '#22c55e';
      }
      
      track.appendChild(fill);
      wrap.appendChild(label);
      if (!isOOS && stock > 0) wrap.appendChild(track);
      return { wrapper: wrap, fillElement: fill, targetWidth: targetWidth };
    }
    
    // ── Update Nav Cart Badge ──────────────────────────────
    async function updateCartBadge() {
      if (typeof AUTH === 'undefined' || !AUTH.isLoggedIn()) return;
      try {
        const cart = await API.getCart();
        const data = cart.data || cart;
        const count = (data.items || []).reduce((sum, item) => sum + (item.quantity || 0), 0);
        document.querySelectorAll('[data-cart-count]').forEach(el => {
          el.textContent = count;
          el.style.display = count > 0 ? 'flex' : 'none';
        });
      } catch (err) {
        console.warn('Cart badge:', err.message);
      }
    }
  </script>
</body>
