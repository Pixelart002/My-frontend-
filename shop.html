<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Luviio</title>
  
  <link rel="stylesheet" href="/css/luviio.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8360942174797973" crossorigin="anonymous"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <style>
    /* ── LAYOUT & BREATHING SPACE ── */
    .shop-layout {
      display: flex;
      gap: 48px;
      align-items: flex-start;
    }

    .shop-main {
      flex: 1;
      min-width: 0;
    }

    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .shop-count {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* ── SEARCH ── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      flex: 1;
      max-width: 380px;
      transition: all 0.3s ease;
    }
    .search-bar:focus-within { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201, 165, 94, 0.2); }
    .search-bar input { background: none; border: none; outline: none; color: var(--text); font-size: 15px; width: 100%; }
    .search-bar i { font-size: 18px; color: var(--text-muted); transition: color 0.3s; }
    .search-bar:focus-within i { color: var(--gold); transform: scale(1.1); }

    /* ── CUSTOM ICON BUTTONS (Sort & Filter) ── */
    .icon-btn {
      display: flex; align-items: center; justify-content: center; width: 46px; height: 46px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-size: 20px; cursor: pointer; transition: all 0.3s;
    }
    .icon-btn:hover { border-color: var(--gold); background: rgba(201, 165, 94, 0.05); color: var(--gold); }

    /* ── RESPONSIVE PRODUCT GRID (No Ghutan) ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 48px;
    }

    /* ── LUXURY PRODUCT CARDS ── */
    .product-card {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
      border-color: var(--border-light);
    }

    .product-card-img {
      position: relative;
      background: var(--surface-2);
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: var(--border);
    }
    .product-card-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .product-card:hover .product-card-img img { transform: scale(1.06); }
    .product-card-img.is-oos::after { content: ''; position: absolute; inset: 0; background: rgba(8, 8, 8, 0.55); backdrop-filter: grayscale(80%); z-index: 1; }

    .card-stock-badge {
      position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-transform: uppercase;
    }
    .card-stock-badge.out { background: var(--error); color: #fff; }
    .card-stock-badge.low { background: #e0a952; color: #000; }

    .product-card-body {
      display: flex; flex-direction: column; flex: 1;
      padding: 24px; /* Superior breathing space */
    }

    .product-card-name {
      font-family: 'Playfair Display', serif;
      font-size: 18px; font-weight: 600; line-height: 1.4;
      margin-bottom: 12px; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .product-card-price-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .product-card-price { font-size: 18px; font-weight: 700; color: var(--gold); }
    .product-card-compare { font-size: 13px; color: var(--text-muted); text-decoration: line-through; }

    /* ── CART CONTROLS ── */
    .card-controls {
      display: flex;
      gap: 12px;
      margin-top: auto;
      flex-wrap: wrap; 
    }

    .qty-input-group {
      display: flex; align-items: center; flex: 1; min-width: 100px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface-2); height: 44px; overflow: hidden;
      transition: border-color 0.3s;
    }
    
    .qty-input-btn {
      width: 36px; height: 100%; background: none; border: none;
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .qty-input-btn:hover { background: rgba(255,255,255,0.05); color: var(--gold); }

    /* 🔥 THE TWEAK: Make it editable but hide the default browser spin buttons */
    .qty-input-field {
      flex: 1; height: 100%; width: 100%; min-width: 0; text-align: center;
      background: none; border: none; color: var(--text); font-size: 15px; font-weight: 600; outline: none;
      -moz-appearance: textfield; /* Hides Firefox selectors */
    }
    .qty-input-field::-webkit-outer-spin-button, 
    .qty-input-field::-webkit-inner-spin-button { 
      -webkit-appearance: none; /* Hides Chrome/Safari/Edge selectors */
      margin: 0; 
    }

    .add-cart-icon-btn {
      width: 56px; height: 44px; background: var(--gold); color: #080808;
      border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(201, 169, 110, 0.2); flex-shrink: 0;
    }
    .add-cart-icon-btn:hover:not(:disabled) { background: #b59454; transform: scale(1.05); }
    .add-cart-icon-btn:active:not(:disabled) { transform: scale(0.95); }
    
    /* OOS State Button */
    .add-cart-icon-btn:disabled { 
      background: var(--surface-2); color: var(--text-dim); box-shadow: none; 
      cursor: not-allowed; width: 100%; font-size: 14px; font-weight: 600; 
      letter-spacing: 1px; flex: 1; gap: 8px; border: 1px solid var(--border);
    }

    /* ── CUSTOM PURE CSS SPINNER LOADER ── */
    .custom-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(8, 8, 8, 0.2);
      border-top-color: #080808;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── POPUPS & SIDEBARS ── */
    .bottom-sheet-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); }
    .bottom-sheet-overlay.active { display: block; }
    .bottom-sheet-content { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 28px; transform: translateY(100%); }
    .bottom-sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .bottom-sheet-header h3 { display: flex; align-items: center; gap: 10px; font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; margin: 0; color: var(--text); }
    .close-sheet-btn { background: none; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; }
    .popup-option { display: flex; align-items: center; gap: 14px; padding: 16px 0; cursor: pointer; font-size: 16px; border-bottom: 1px solid var(--border); }
    .popup-option:last-child { border-bottom: none; }
    .popup-option input[type="radio"] { display: none; }
    .custom-radio-circle { width: 22px; height: 22px; border: 2px solid var(--border-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
    .custom-radio-circle::after { content: ''; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; transform: scale(0); transition: transform 0.3s; }
    .popup-option input[type="radio"]:checked + .custom-radio-circle { border-color: var(--gold); }
    .popup-option input[type="radio"]:checked + .custom-radio-circle::after { transform: scale(1); }
    .popup-option input[type="radio"]:checked ~ span.option-label { color: var(--gold); font-weight: 600; }

    /* Empty states */
    .empty-state { text-align: center; padding: 80px 20px; background: var(--surface); border-radius: 20px; border: 1px dashed var(--border); grid-column: 1/-1; }
    .empty-state-icon { font-size: 56px; color: var(--border-light); margin-bottom: 20px; }

    /* SLEEK FILTER SIDEBAR */
    #filter-sidebar-mobile { display: none; position: fixed; inset: 0; z-index: 1100; background: transparent; transition: background 0.4s; }
    #filter-sidebar-mobile.open { display: block; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); }
    #filter-sidebar-inner { position: absolute; top: 0; left: 0; bottom: 0; width: 300px; background: var(--surface); padding: 32px 24px; overflow-y: auto; transform: translateX(-100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    #filter-sidebar-mobile.open #filter-sidebar-inner { transform: translateX(0); }
    
    .filter-group-title { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 600; font-size: 15px; color: var(--text); }
    .filter-option { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; font-size: 14px; color: var(--text-muted); background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; transition: all 0.3s; }
    .filter-option:hover { background: var(--surface); border-color: var(--border); }
    .filter-option.active { border-color: var(--gold); color: var(--gold); background: rgba(201, 165, 94, 0.05); font-weight: 500; }
    .filter-option i { font-size: 18px; opacity: 0; transform: scale(0.8); transition: all 0.3s; }
    .filter-option.active i { opacity: 1; transform: scale(1); }
    
    /* Active Filters */
    .active-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--surface-2); cursor: pointer; transition: all 0.3s; }
    .filter-chip:hover { border-color: var(--error); color: var(--error); background: rgba(224, 77, 54, 0.1); }

    /* Responsiveness */
    .filter-toggle-btn { display: none; }
    @media (max-width: 900px) {
      .filter-sidebar { display: none; }
      .filter-toggle-btn { display: flex; }
      .bottom-sheet-content { margin: 0 auto; max-width: 100%; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    }
    @media (min-width: 901px) {
      .bottom-sheet-content { max-width: 420px; bottom: 50%; left: 50%; right: auto; border-radius: 24px; transform: translate(-50%, 50%) scale(0.9) !important; opacity: 0; }
    }
    @media (max-width: 600px) {
      .shop-header { flex-direction: column; align-items: stretch; }
      .search-bar { max-width: none; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
      .product-card-body { padding: 16px; }
      .product-card-name { font-size: 15px; }
      .product-card-price { font-size: 16px; }
    }
  </style>
</head>
<body class="bg-[#080808] text-[#f0ece4] font-body antialiased selection:bg-gold selection:text-black">

  <nav id="main-nav"></nav>

  <div class="page-wrapper">
    <div class="container" style="padding-top:32px; padding-bottom:80px;">
      
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/index.html"><i class="ri-home-4-line" style="vertical-align: middle;"></i> Home</a><span style="margin: 0 8px;">›</span>
        <span id="bc-current" class="text-gold font-medium">Shop</span>
      </nav>

      <div class="shop-layout" style="margin-top: 24px;">
        
        <!-- Desktop Sidebar -->
        <aside class="filter-sidebar" id="filter-sidebar-desktop" style="width: 260px; flex-shrink: 0;">
          <div id="filter-content"></div>
        </aside>

        <!-- Mobile Sidebar -->
        <div id="filter-sidebar-mobile">
          <div id="filter-sidebar-inner">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
              <strong style="font-family:'Playfair Display', serif; font-size:24px; display:flex; align-items:center; gap:8px;">
                <i class="ri-equalizer-line"></i> Filters
              </strong>
              <button onclick="closeMobileFilter()" style="background:none; border:none; color:var(--text-muted); font-size:28px; cursor:pointer;"><i class="ri-close-line"></i></button>
            </div>
            <div id="filter-content-mobile"></div>
          </div>
        </div>

        <main class="shop-main">
          
          <div class="shop-header">
            <div style="display:flex; align-items:center; gap:16px; flex:1; flex-wrap:wrap;">
              <!-- Icon only for mobile filters -->
              <button class="icon-btn filter-toggle-btn" onclick="openMobileFilter()" title="Filters">
                <i class="ri-equalizer-line"></i>
              </button>
              
              <div class="search-bar">
                <i class="ri-search-line"></i>
                <input type="text" id="search-input" placeholder="Search curated luxury..." maxlength="100" autocomplete="off">
              </div>
            </div>
            
            <div style="display:flex; align-items:center; gap:16px;">
              <span class="shop-count" id="product-count"></span>
              
              <!-- Icon only sort button -->
              <button class="icon-btn" id="sort-trigger" onclick="openSortPopup()" title="Sort By">
                <i class="ri-sort-desc"></i>
              </button>
            </div>
          </div>

          <div class="active-filters" id="active-filters"></div>

          <div id="products-grid" class="products-grid">
            <div style="height:420px; border-radius:20px;" class="skeleton"></div>
            <div style="height:420px; border-radius:20px;" class="skeleton"></div>
            <div style="height:420px; border-radius:20px;" class="skeleton"></div>
            <div style="height:420px; border-radius:20px;" class="skeleton"></div>
            <div style="height:420px; border-radius:20px;" class="skeleton"></div>
            <div style="height:420px; border-radius:20px;" class="skeleton"></div>
          </div>

          <div id="pagination" class="pagination" style="display:flex; gap:8px; justify-content:center; margin-top:40px;"></div>
        </main>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom" style="border-top:none; margin-top:0;">
          <span style="font-weight:bold; letter-spacing:1px; color:var(--gold);">© 2026 LUVIIO</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Sort Bottom Sheet -->
  <div id="sort-popup" class="bottom-sheet-overlay" onclick="handlePopupOverlayClick(event)">
    <div class="bottom-sheet-content" id="sort-popup-content">
      <div class="bottom-sheet-header">
        <h3><i class="ri-sort-desc"></i> Sort Collection</h3>
        <button class="close-sheet-btn" onclick="closeSortPopup()"><i class="ri-close-line"></i></button>
      </div>
      <div class="popup-options">
        <label class="popup-option">
          <input type="radio" name="sort_radio" value="" checked onchange="applySort(this)">
          <div class="custom-radio-circle"></div>
          <span class="option-label">Featured</span>
        </label>
        <label class="popup-option">
          <input type="radio" name="sort_radio" value="price_asc" onchange="applySort(this)">
          <div class="custom-radio-circle"></div>
          <span class="option-label">Price: Low to High</span>
        </label>
        <label class="popup-option">
          <input type="radio" name="sort_radio" value="price_desc" onchange="applySort(this)">
          <div class="custom-radio-circle"></div>
          <span class="option-label">Price: High to Low</span>
        </label>
      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="/js/theme.js"></script>
  <script src="/js/keys.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/push.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    let state = {
      page: 1,
      search: getParam('search') || '',
      category: getParam('category') || '',
      min_price: getParam('min_price') || '',
      max_price: getParam('max_price') || '',
      in_stock: getParam('in_stock') === 'true',
      sort: '',
      total: 0,
      pages: 1,
    };
    
    let categories = [];
    let searchTimer;

    pageInit();
    
    document.addEventListener("DOMContentLoaded", () => {
      gsap.from(".breadcrumb", { opacity: 0, y: -10, duration: 0.6, ease: "power2.out" });
      gsap.from(".shop-header", { opacity: 0, y: 15, duration: 0.8, delay: 0.1, ease: "power2.out" });
      if(window.innerWidth > 900) {
        gsap.from("#filter-sidebar-desktop", { opacity: 0, x: -20, duration: 0.8, delay: 0.2, ease: "power2.out" });
      }
    });

    loadCategories();
    document.getElementById('search-input').value = state.search;

    function openSortPopup() {
      const popup = document.getElementById('sort-popup');
      const content = document.getElementById('sort-popup-content');
      popup.classList.add('active');
      document.body.style.overflow = 'hidden';
      
      if(window.innerWidth <= 900) {
        gsap.fromTo(content, { y: '100%' }, { y: '0%', duration: 0.4, ease: "power3.out" });
      } else {
        gsap.fromTo(content, { opacity: 0, scale: 0.95, y: '-50%', x: '-50%' }, { opacity: 1, scale: 1, y: '-50%', x: '-50%', duration: 0.3, ease: "power2.out" });
      }
    }

    function closeSortPopup() {
      const popup = document.getElementById('sort-popup');
      const content = document.getElementById('sort-popup-content');
      document.body.style.overflow = '';
      
      if(window.innerWidth <= 900) {
        gsap.to(content, { y: '100%', duration: 0.3, ease: "power3.in", onComplete: () => popup.classList.remove('active') });
      } else {
        gsap.to(content, { opacity: 0, scale: 0.95, duration: 0.2, ease: "power2.in", onComplete: () => popup.classList.remove('active') });
      }
    }

    function handlePopupOverlayClick(e) {
      if (e.target === e.currentTarget) closeSortPopup();
    }

    function applySort(radioElement) {
      state.sort = radioElement.value;
      state.page = 1;
      setTimeout(() => {
        closeSortPopup();
        loadProducts();
      }, 300);
    }

    document.getElementById('search-input').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.search = e.target.value.trim().toLowerCase();
        state.page = 1;
        loadProducts();
      }, 400);
    });

    function buildFilterHTML() {
      return `
        <div class="filter-group">
          <div class="filter-group-title"><i class="ri-layout-grid-line text-gold"></i> Categories</div>
          <div class="filter-option ${!state.category ? 'active' : ''}" data-cat="" onclick="setCategory('')">
            <span>All Collections</span>
            <i class="ri-check-line"></i>
          </div>
          ${categories.map(c => `
            <div class="filter-option ${state.category === c.slug ? 'active' : ''}" data-cat="${escapeHTML(c.slug)}" onclick="setCategory('${escapeHTML(c.slug)}')">
              <span>${escapeHTML(c.name)}</span>
              <i class="ri-check-line"></i>
            </div>
          `).join('')}
        </div>
        
        <div class="filter-group" style="margin-top: 32px;">
          <div class="filter-group-title"><i class="ri-money-dollar-circle-line text-gold"></i> Price Range</div>
          <div class="price-range" style="flex-direction:column; gap:12px;">
            <div class="price-range" style="width: 100%; display:flex; gap:10px; align-items:center;">
              <input type="number" class="form-input" style="padding:10px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text); flex:1; width:100%; outline:none;" placeholder="Min" id="min-price-inp" value="${escapeHTML(state.min_price)}" min="0">
              <span style="color:var(--text-muted)">—</span>
              <input type="number" class="form-input" style="padding:10px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text); flex:1; width:100%; outline:none;" placeholder="Max" id="max-price-inp" value="${escapeHTML(state.max_price)}" min="0">
            </div>
            <button class="btn btn-outline" style="padding:10px; width:100%; font-size:13px; font-weight:600; transition: all 0.3s; cursor:pointer; border-radius:8px;" onclick="applyPrice()">Apply Range</button>
          </div>
        </div>
        
        <div class="filter-group" style="margin-top: 32px;">
          <div class="filter-group-title"><i class="ri-box-3-line text-gold"></i> Availability</div>
          <div class="filter-option ${state.in_stock ? 'active' : ''}" onclick="toggleInStock()">
            <span>In Stock Only</span>
            <i class="ri-check-line"></i>
          </div>
        </div>
        
        <button class="btn btn-outline" style="width:100%; padding:12px; margin-top:32px; transition: all 0.3s; cursor:pointer; border-radius:12px; color:var(--error); border-color:var(--border);" onclick="clearFilters()">
          <i class="ri-refresh-line" style="vertical-align: middle;"></i> Clear Filters
        </button>
      `;
    }

    window.setCategory = (slug) => {
      state.category = slug;
      state.page = 1;
      renderFilters();
      loadProducts();
      updateBreadcrumb();
    };

    window.toggleInStock = () => {
      state.in_stock = !state.in_stock;
      state.page = 1;
      renderFilters();
      loadProducts();
    };

    function renderFilters() {
      const html = buildFilterHTML();
      document.getElementById('filter-content').innerHTML = html;
      document.getElementById('filter-content-mobile').innerHTML = html;
    }

    const applyPrice = () => {
      state.min_price = document.querySelectorAll('#min-price-inp')[0]?.value || '';
      state.max_price = document.querySelectorAll('#max-price-inp')[0]?.value || '';
      state.page = 1;
      loadProducts();
    };

    const clearFilters = () => {
      state = { ...state, category: '', min_price: '', max_price: '', in_stock: false, page: 1 };
      renderFilters();
      loadProducts();
    };

    const updateBreadcrumb = () => {
      const cat = categories.find(c => c.slug === state.category);
      const el = document.getElementById('bc-current');
      if (el) {
        gsap.to(el, { opacity: 0, duration: 0.2, onComplete: () => {
          el.textContent = cat ? cat.name : 'Shop';
          gsap.to(el, { opacity: 1, duration: 0.2 });
        }});
      }
    };

    function updateActiveFilters() {
      const wrap = document.getElementById('active-filters');
      wrap.innerHTML = '';
      
      const addChip = (label, fn) => {
        const chip = document.createElement('span');
        chip.className = 'filter-chip';
        chip.innerHTML = `${label} <i class="ri-close-line" style="font-size:16px;"></i>`;
        gsap.fromTo(chip, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" });
        chip.addEventListener('click', () => {
          gsap.to(chip, { scale: 0.5, opacity: 0, duration: 0.2, onComplete: fn });
        });
        wrap.appendChild(chip);
      };
      
      if (state.category) {
        const cat = categories.find(c => c.slug === state.category);
        addChip(cat?.name || state.category, () => {
          state.category = '';
          state.page = 1;
          renderFilters();
          loadProducts();
        });
      }
      if (state.min_price) {
        addChip(`Min: ${formatPrice(state.min_price)}`, () => {
          state.min_price = '';
          renderFilters();
          loadProducts();
        });
      }
      if (state.max_price) {
        addChip(`Max: ${formatPrice(state.max_price)}`, () => {
          state.max_price = '';
          renderFilters();
          loadProducts();
        });
      }
      if (state.in_stock) {
        addChip('In Stock', () => {
          state.in_stock = false;
          renderFilters();
          loadProducts();
        });
      }
    }

    const openMobileFilter = () => {
      document.getElementById('filter-sidebar-mobile').classList.add('open');
      document.body.style.overflow = 'hidden';
    };
    
    const closeMobileFilter = () => {
      document.getElementById('filter-sidebar-mobile').classList.remove('open');
      document.body.style.overflow = '';
    };
    
    document.getElementById('filter-sidebar-mobile').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeMobileFilter();
    });

    async function loadCategories() {
      try {
        const raw = await API.getCategories();
        categories = Array.isArray(raw) ? raw : (raw?.data || []);
        renderFilters();
        updateBreadcrumb();
      } catch (err) {
        console.error("Failed to load categories", err);
      }
      loadProducts();
    }

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = Array(6).fill('<div style="height:420px; border-radius:20px;" class="skeleton"></div>').join('');
      updateActiveFilters();

      const params = { page: state.page, page_size: state.search ? 100 : 12 };
      if (state.category)  params.category  = state.category;
      if (state.min_price) params.min_price = state.min_price;
      if (state.max_price) params.max_price = state.max_price;
      if (state.in_stock)  params.in_stock  = true;

      try {
        const res = await API.getProducts(params);
        let items = Array.isArray(res) ? res : (res?.items || res?.data || []);
        let meta = res?.meta || {};

        if (state.search) {
          items = items.filter(p => p.name.toLowerCase().includes(state.search));
          state.total = items.length;
          state.pages = Math.ceil(items.length / 12) || 1;
          const startIndex = (state.page - 1) * 12;
          items = items.slice(startIndex, startIndex + 12);
        } else {
          state.total = meta.total_items ?? items.length;
          state.pages = meta.total_pages ?? 1;
        }
        
        const countEl = document.getElementById('product-count');
        countEl.innerHTML = `<i class="ri-stack-line" style="vertical-align:middle; margin-right:4px;"></i> ${state.total} items`;
        gsap.fromTo(countEl, {opacity:0, x: -10}, {opacity:1, x: 0, duration: 0.4});

        grid.innerHTML = '';

        if (state.sort === 'price_asc')  items.sort((a, b) => a.price - b.price);
        if (state.sort === 'price_desc') items.sort((a, b) => b.price - a.price);

        if (!items.length) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon"><i class="ri-search-eye-line"></i></div>
              <h3 style="font-family:'Playfair Display',serif; font-size:24px; margin-bottom:8px;">No products found</h3>
              <p style="color:var(--text-muted); margin-bottom:24px;">Try adjusting your filters or search term to find what you're looking for.</p>
              <button class="btn btn-outline" style="padding:12px 24px; border-radius:12px;" onclick="clearFilters()">Clear All Filters</button>
            </div>
          `;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        items.forEach(p => grid.appendChild(makeProductCard(p)));
        
        gsap.fromTo(grid.children, 
          { opacity: 0, y: 40, scale: 0.95 }, 
          { opacity: 1, y: 0, scale: 1, duration: 0.6, stagger: 0.08, ease: "power3.out", clearProps: "all" }
        );

        renderPagination();
        
      } catch (err) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" style="color:var(--error);"><i class="ri-error-warning-line"></i></div>
            <h3 style="font-family:'Playfair Display',serif; font-size:24px; margin-bottom:8px;">Could not load products</h3>
            <p style="color:var(--text-muted); margin-bottom:24px;">${escapeHTML(err.message)}</p>
            <button class="btn btn-outline" style="padding:12px 24px; border-radius:12px;" onclick="loadProducts()"><i class="ri-refresh-line"></i> Retry</button>
          </div>
        `;
      }
    }

    function makeProductCard(p) {
      const isOOS = p.stock === 0;
      const isLow = !isOOS && p.stock <= (p.low_stock_threshold || 10);

      const card = document.createElement('div');
      card.className = 'product-card';

      // ── Image ──
      const imgWrap = document.createElement('div');
      imgWrap.className = 'product-card-img' + (isOOS ? ' is-oos' : '');

      if (p.image_url) {
        const img = document.createElement('img');
        img.src = escapeHTML(p.image_url);
        img.alt = escapeHTML(p.name);
        img.loading = 'lazy';
        imgWrap.appendChild(img);
      } else {
        imgWrap.innerHTML = '<i class="ri-image-line"></i>';
      }

      if (isOOS) {
        const badge = document.createElement('span');
        badge.className = 'card-stock-badge out';
        badge.innerHTML = '<i class="ri-close-circle-line" style="margin-right:2px; vertical-align:middle;"></i> Sold Out';
        imgWrap.appendChild(badge);
      } else if (isLow) {
        const badge = document.createElement('span');
        badge.className = 'card-stock-badge low';
        badge.innerHTML = p.stock <= 3 ? `Only ${p.stock} left!` : `Low Stock`;
        imgWrap.appendChild(badge);
      }

      // ── Body ──
      const body = document.createElement('div');
      body.className = 'product-card-body';

      const name = document.createElement('div');
      name.className = 'product-card-name';
      name.textContent = p.name;

      const priceRow = document.createElement('div');
      priceRow.className = 'product-card-price-row';

      const price = document.createElement('div');
      price.className = 'product-card-price';
      price.textContent = formatPrice(p.price);
      priceRow.appendChild(price);

      if (p.compare_price) {
        const cmp = document.createElement('div');
        cmp.className = 'product-card-compare';
        cmp.textContent = formatPrice(p.compare_price);
        priceRow.appendChild(cmp);
      }

      // ── CART CONTROLS ──
      const controls = document.createElement('div');
      controls.className = 'card-controls';

      if (isOOS) {
        const oosBtn = document.createElement('button');
        oosBtn.className = 'add-cart-icon-btn';
        oosBtn.disabled = true;
        oosBtn.innerHTML = '<i class="ri-forbid-2-line" style="font-size:18px;"></i> Sold Out';
        controls.appendChild(oosBtn);
      } else {
        const qtyWrap = document.createElement('div');
        qtyWrap.className = 'qty-input-group';
        
        const minusBtn = document.createElement('button');
        minusBtn.className = 'qty-input-btn';
        minusBtn.innerHTML = '<i class="ri-subtract-line"></i>';
        
        // 🔥 THE TWEAK: Direct Input Box (Typable)
        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.className = 'qty-input-field';
        qtyInput.value = '1';
        qtyInput.min = '1';
        if (p.stock) qtyInput.max = p.stock;

        const plusBtn = document.createElement('button');
        plusBtn.className = 'qty-input-btn';
        plusBtn.innerHTML = '<i class="ri-add-line"></i>';

        // Listeners for +/- buttons
        minusBtn.addEventListener('click', e => {
          e.stopPropagation();
          let v = parseInt(qtyInput.value) || 1;
          if (v > 1) qtyInput.value = v - 1;
        });

        plusBtn.addEventListener('click', e => {
          e.stopPropagation();
          let v = parseInt(qtyInput.value) || 1;
          if (!p.stock || v < p.stock) qtyInput.value = v + 1;
        });

        // Listeners for manual typing
        qtyInput.addEventListener('click', e => e.stopPropagation());
        qtyInput.addEventListener('change', e => {
          e.stopPropagation();
          let v = parseInt(qtyInput.value);
          if (isNaN(v) || v < 1) v = 1;
          if (p.stock && v > p.stock) v = p.stock;
          qtyInput.value = v;
        });

        qtyWrap.appendChild(minusBtn);
        qtyWrap.appendChild(qtyInput);
        qtyWrap.appendChild(plusBtn);

        // Add to Cart Icon Button
        const cartBtn = document.createElement('button');
        cartBtn.className = 'add-cart-icon-btn';
        cartBtn.innerHTML = '<i class="ri-shopping-cart-2-line"></i>';

        cartBtn.addEventListener('click', async e => {
          e.stopPropagation();
          
          if (typeof AUTH !== 'undefined' && !AUTH.isLoggedIn()) {
            showToast('Please sign in first', 'warn');
            return setTimeout(() => window.location.href = '/login.html', 1000);
          }

          const originalContent = '<i class="ri-shopping-cart-2-line"></i>';
          cartBtn.disabled = true;
          cartBtn.innerHTML = '<div class="custom-spinner"></div>';

          try {
            const finalQty = parseInt(qtyInput.value) || 1;
            await API.addCartItem(p.id, finalQty);
            showToast(`${finalQty}x ${p.name} added`, 'success');
            
            cartBtn.innerHTML = '<i class="ri-check-line"></i>';
            cartBtn.style.background = '#22c55e';
            cartBtn.style.color = '#fff';

            const c = await API.getCart() || {};
            const cnt = (c.items || []).reduce((a, b) => a + b.quantity, 0);
            document.querySelectorAll('[data-cart-count]').forEach(el => { 
              el.innerText = cnt;
              el.style.display = cnt > 0 ? 'flex' : 'none'; 
            });
          } catch (err) {
            showToast(err.message || 'Failed to add', 'error');
            cartBtn.innerHTML = originalContent;
          } finally {
            setTimeout(() => { 
              cartBtn.innerHTML = originalContent;
              cartBtn.style.background = '';
              cartBtn.style.color = '';
              cartBtn.disabled = false; 
            }, 1500);
          }
        });

        controls.appendChild(qtyWrap);
        controls.appendChild(cartBtn);
      }

      body.appendChild(name);
      body.appendChild(priceRow);
      body.appendChild(controls);
      
      card.appendChild(imgWrap);
      card.appendChild(body);

      // Card Click -> Details Page
      card.addEventListener('click', e => {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'INPUT') return;
        window.location.href = `/product.html?slug=${encodeURIComponent(p.slug)}`;
      });

      return card;
    }

    function renderPagination() {
      const wrap = document.getElementById('pagination');
      wrap.innerHTML = '';
      if (state.pages <= 1) return;
      
      const mk = (label, page, active = false, icon = null) => {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (active ? ' active' : '');
        btn.style.cssText = `width:44px; height:44px; border-radius:12px; border:1px solid ${active ? 'var(--gold)' : 'var(--border)'}; background:${active ? 'rgba(201, 165, 94, 0.1)' : 'var(--surface)'}; color:${active ? 'var(--gold)' : 'var(--text)'}; font-weight:${active ? '700' : '500'}; cursor:pointer; transition:all 0.3s; font-family:inherit; display:flex; align-items:center; justify-content:center; font-size:16px;`;
        btn.innerHTML = icon ? `<i class="${icon}"></i>` : label;
        
        btn.addEventListener('click', () => {
          state.page = page;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(loadProducts, 200); 
        });
        return btn;
      };
      
      if (state.page > 1) wrap.appendChild(mk('', state.page - 1, false, 'ri-arrow-left-s-line'));
      for (let i = 1; i <= state.pages; i++) {
        if (state.pages > 8 && Math.abs(i - state.page) > 2 && i !== 1 && i !== state.pages) continue;
        wrap.appendChild(mk(i, i, i === state.page));
      }
      if (state.page < state.pages) wrap.appendChild(mk('', state.page + 1, false, 'ri-arrow-right-s-line'));
    }
  </script>
</body>
</html>
