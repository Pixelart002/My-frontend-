name: One-time post-deploy profile login smoke test

on:
  push:
    branches:
      - test/profile-login-live-postdeploy

permissions:
  contents: read

jobs:
  live-login-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed profile icon opens sign-in form
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              page.setDefaultTimeout(10000);
              page.on('pageerror', error => console.error('PAGE ERROR:', error.message));
              const response = await page.goto('https://www.luviio.in/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (!response || response.status() !== 200) throw new Error('Homepage did not return HTTP 200.');
              await page.locator('.header-account-icon').waitFor({ state: 'visible' });
              await page.locator('.header-account-icon').click();
              await page.waitForURL(url => url.pathname === '/login', { timeout: 10000 });
              await page.getByRole('heading', { name: 'Sign in' }).waitFor({ state: 'visible' });
              await page.getByLabel(/^Email$/).waitFor({ state: 'visible' });
              await page.getByLabel(/^Password$/).waitFor({ state: 'visible' });
              if (await page.getByText(/session could not be restored/i).count()) throw new Error('Obsolete session recovery screen is visible.');
              if (await page.getByRole('button', { name: /retry session/i }).count()) throw new Error('Obsolete Retry session button is visible.');
              console.log('PASS: profile icon opens sign-in form:', page.url());
              const direct = await browser.newPage();
              const directResponse = await direct.goto('https://www.luviio.in/account', { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (!directResponse || directResponse.status() !== 200) throw new Error('Account deep link did not return HTTP 200.');
              await direct.waitForURL(url => url.pathname === '/login', { timeout: 10000 });
              await direct.getByRole('heading', { name: 'Sign in' }).waitFor({ state: 'visible' });
              console.log('PASS: direct /account deep link reaches sign-in form.');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
