name: One-time checkout order number fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix CheckoutPage order object prop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/CheckoutPage.jsx')
          text = path.read_text(encoding='utf-8')
          old = 'activeOrder={Boolean(activeOrder)}'
          new = 'activeOrder={activeOrder}'
          if old not in text:
              raise SystemExit('Expected buggy prop was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CheckoutPage.jsx .github/workflows/one-time-fix-order-number.yml
          git commit -m 'fix checkout COD order number display'
          git push
