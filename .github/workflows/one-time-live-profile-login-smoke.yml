name: One-time live profile login smoke test

on:
  push:
    branches:
      - test/live-profile-login-form

permissions:
  contents: read

jobs:
  live-login-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser runner
        run: |
          mkdir -p /tmp/luviio-browser-smoke
          npm install --prefix /tmp/luviio-browser-smoke --no-save playwright
          /tmp/luviio-browser-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify live account icon opens the real sign-in form
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH=/tmp/luviio-browser-smoke/node_modules node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1,
              });
              page.on('pageerror', (error) => console.error('PAGE ERROR:', error.message));

              const home = await page.goto('https://www.luviio.in/', {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              if (!home || home.status() !== 200) {
                throw new Error('Homepage did not return HTTP 200.');
              }
              await page.locator('.header-account-icon').waitFor({
                state: 'visible',
                timeout: 30000,
              });
              await page.locator('.header-account-icon').click();

              await page.waitForURL(
                (url) => url.pathname === '/login',
                { timeout: 25000 },
              );
              await page.getByRole('heading', { name: 'Sign in' }).waitFor({
                state: 'visible',
                timeout: 15000,
              });
              await page.getByLabel('Email').waitFor({ state: 'visible' });
              await page.getByLabel(/^Password$/).waitFor({ state: 'visible' });

              const bodyText = await page.locator('body').innerText();
              if (/session could not be restored/i.test(bodyText)) {
                throw new Error('Obsolete session recovery screen is still visible.');
              }
              if (await page.getByRole('button', { name: /retry session/i }).count()) {
                throw new Error('Obsolete Retry session button is still visible.');
              }

              console.log('PASS: profile icon navigated to', page.url());
              console.log('PASS: Sign in heading, Email field, and Password field are visible.');
              console.log('PASS: no Session could not be restored / Retry session screen.');
              
              const directPage = await browser.newPage({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1,
              });
              await directPage.goto('https://www.luviio.in/account', {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              await directPage.waitForURL(
                (url) => url.pathname === '/login',
                { timeout: 25000 },
              );
              await directPage.getByRole('heading', { name: 'Sign in' }).waitFor({
                state: 'visible',
                timeout: 15000,
              });
              console.log('PASS: direct /account deep link also reaches the sign-in form.');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
