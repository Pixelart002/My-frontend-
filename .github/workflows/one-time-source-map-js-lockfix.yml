name: One-time source-map-js lockfile remediation

on:
  push:
    branches:
      - security/source-map-js-lockfix

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm update source-map-js --package-lock-only --ignore-scripts --no-save
          node --input-type=commonjs -e '
            const lock = require("./package-lock.json");
            const version = lock.packages["node_modules/source-map-js"]?.version;
            console.log("Locked source-map-js version:", version);
            if (version !== "1.2.2") {
              console.error("Expected patched source-map-js 1.2.2; refusing to commit.");
              process.exit(1);
            }
          '
          npm ci
      - name: Verify production dependencies are free of high/critical advisories
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-production.json
          audit_exit=$?
          set -e
          node --input-type=commonjs -e '
            const report = require("/tmp/npm-audit-production.json");
            const meta = report.metadata?.vulnerabilities || {};
            console.log("Production audit:", JSON.stringify(meta));
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              console.log(name + ": " + v.severity + " (" + v.range + ")");
            }
            if ((meta.high || 0) + (meta.critical || 0) > 0) process.exit(1);
          '
      - name: Frontend CI verification
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit verified lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change was produced."
            exit 1
          fi
          git commit -m "fix(security): update patched source-map-js transitive dependency"
          git push origin HEAD:security/source-map-js-lockfix
