name: One-time Tailwind v4 security migration

on:
  push:
    branches:
      - security/tailwind-v4-audit-remediation

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrate build CSS to Tailwind v4 and preserve root encapsulation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.devDependencies = pkg.devDependencies || {};
          pkg.devDependencies.tailwindcss = '4.3.3';
          pkg.devDependencies['@tailwindcss/cli'] = '4.3.3';
          pkg.devDependencies.postcss = '^8.5.6';
          pkg.devDependencies['postcss-selector-parser'] = '7.1.6';
          pkg.overrides = { ...(pkg.overrides || {}), '@parcel/watcher': '2.6.0' };
          pkg.scripts['build:css'] = 'tailwindcss -i ./src/styles/tailwind-input.css -o ./public/tailwind.css --minify && node ./scripts/scope-tailwind-utilities.mjs';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cat > src/styles/tailwind-input.css <<'CSS'
          @import "tailwindcss" source(none);

          @source "../../index.html";
          @source "../**/*.{js,jsx,ts,tsx}";
          @source "../../js/**/*.js";

          @theme {
            --color-gold: var(--gold, #d8ad6a);
            --color-gold-ink: var(--gold-ink, #17130e);
            --color-gold-soft: var(--gold-soft, #f0cf97);
            --color-gold-dim: var(--gold-dim, rgba(216, 173, 106, 0.12));
            --color-surface: var(--surface, #1b1917);
            --color-surface-2: var(--surface-2, #24211e);
            --color-line: var(--line, #3a3530);
            --color-text: var(--text, #f5efe7);
            --color-muted: var(--muted, #a59b91);
            --color-dim: var(--dim, #a59b91);
            --color-success: var(--success, #6fbf8a);
            --color-success-dim: var(--success-dim, rgba(111, 191, 138, 0.12));
            --color-danger: var(--danger, #e0735f);
            --color-danger-dim: var(--danger-dim, rgba(224, 115, 95, 0.12));
            --font-display: "Playfair Display", Georgia, serif;
            --font-body: "DM Sans", system-ui, sans-serif;
            --shadow-luviio-card: 0 18px 44px rgba(0, 0, 0, 0.18);
            --shadow-luviio-image: 0 10px 30px rgba(0, 0, 0, 0.16);
          }
          CSS
          mkdir -p scripts
          cat > scripts/scope-tailwind-utilities.mjs <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import postcss from 'postcss';
          import selectorParser from 'postcss-selector-parser';

          const outputPath = 'public/tailwind.css';
          const css = await readFile(outputPath, 'utf8');
          const root = postcss.parse(css, { from: outputPath });
          let scopedRuleCount = 0;

          root.walkRules((rule) => {
            let current = rule.parent;
            let isUtilityLayer = false;

            while (current) {
              if (
                current.type === 'atrule' &&
                current.name === 'layer' &&
                current.params.split(',').some((name) => name.trim() === 'utilities')
              ) {
                isUtilityLayer = true;
                break;
              }
              current = current.parent;
            }

            if (!isUtilityLayer || !rule.selector) return;

            rule.selector = selectorParser((selectors) => {
              selectors.each((selector) => {
                const first = selector.first;
                if (first?.type === 'id' && first.value === 'root') return;
                selector.prepend(selectorParser.combinator({ value: ' ' }));
                selector.prepend(selectorParser.id({ value: 'root' }));
              });
            }).processSync(rule.selector);

            scopedRuleCount += 1;
          });

          const scopedCss = root.toString();
          if (scopedRuleCount < 100 || !scopedCss.includes('#root .flex')) {
            throw new Error(
              'Tailwind root encapsulation failed: expected at least 100 scoped utility rules and #root .flex.',
            );
          }

          for (const required of ['#root .flex', '#root .text-gold', '#root .hidden']) {
            if (!scopedCss.includes(required)) {
              throw new Error('Required production utility missing after CSS build: ' + required);
            }
          }

          await writeFile(outputPath, scopedCss, 'utf8');
          console.log('Scoped Tailwind utility rules under #root:', scopedRuleCount);
          JS
          git rm tailwind.config.cjs
          npm install --save-dev tailwindcss@4.3.3 @tailwindcss/cli@4.3.3 postcss@^8.5.6 postcss-selector-parser@7.1.6
          npm ci
      - name: Full dependency audit inventory
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-full.json
          audit_exit=$?
          set -e
          node --input-type=commonjs <<'NODE'
          const report = require('/tmp/npm-audit-full.json');
          const meta = report.metadata?.vulnerabilities || {};
          console.log('Full audit totals:', JSON.stringify(meta));
          for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
            const via = (v.via || []).map(x => typeof x === 'string' ? x : (x.title || x.name || x.url)).join(' | ');
            console.log(JSON.stringify({ name, severity: v.severity, direct: v.isDirect, range: v.range, via, fixAvailable: v.fixAvailable }));
          }
          if ((meta.total || 0) > 0) process.exitCode = 1;
          NODE
      - name: Frontend CI and production CSS build
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit verified migration
        if: always() && steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/styles/tailwind-input.css scripts/scope-tailwind-utilities.mjs
          if git diff --cached --quiet; then
            echo "No migration files changed."
            exit 1
          fi
          git commit -m "fix(security): migrate to patched Tailwind v4 toolchain"
          git push origin HEAD:security/tailwind-v4-audit-remediation
