name: One-time safe npm audit fixes

on:
  push:
    branches:
      - security/safe-npm-audit-fixes

permissions:
  contents: write

jobs:
  safe-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update safe brace-expansion patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm update brace-expansion --package-lock-only --ignore-scripts --no-save
          node --input-type=commonjs -e '
            const lock = require("./package-lock.json");
            const version = lock.packages["node_modules/brace-expansion"]?.version || "0.0.0";
            console.log("Locked brace-expansion version:", version);
            const nums = version.split(".").map(Number);
            if (nums[0] !== 1 || nums[1] !== 1 || nums[2] < 21) {
              console.error("Expected compatible patched brace-expansion 1.1.21 or newer in 1.x.");
              process.exit(1);
            }
          '
          npm ci
      - name: Inventory remaining dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-full.json
          set -e
          node --input-type=commonjs -e '
            const report = require("/tmp/npm-audit-full.json");
            const meta = report.metadata?.vulnerabilities || {};
            console.log("Full audit totals:", JSON.stringify(meta));
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              const via = (v.via || []).map(x => typeof x === "string" ? x : (x.title || x.name || x.url)).join(" | ");
              console.log(JSON.stringify({name, severity:v.severity, direct:v.isDirect, range:v.range, via, fixAvailable:v.fixAvailable}));
            }
          '
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-production.json
          set -e
          node --input-type=commonjs -e '
            const report = require("/tmp/npm-audit-production.json");
            const meta = report.metadata?.vulnerabilities || {};
            console.log("Production audit totals:", JSON.stringify(meta));
            if ((meta.high || 0) + (meta.critical || 0) > 0) process.exit(1);
          '
      - name: Frontend verification
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit verified lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No patched lockfile update was produced."
            exit 1
          fi
          git commit -m "fix(security): update brace-expansion to patched 1.1.x"
          git push origin HEAD:security/safe-npm-audit-fixes
