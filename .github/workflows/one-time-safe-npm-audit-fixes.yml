name: One-time safe npm audit fixes

on:
  push:
    branches:
      - security/safe-npm-audit-fixes

permissions:
  contents: write

jobs:
  safe-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply only compatible npm audit fixes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-save
          fix_status=$?
          set -e
          echo "npm audit fix exit=$fix_status (unfixable major-upgrade findings may remain)"
          npm ci
      - name: Inventory remaining dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-full.json
          set -e
          node --input-type=commonjs -e '
            const report = require("/tmp/npm-audit-full.json");
            const meta = report.metadata?.vulnerabilities || {};
            console.log("Full audit totals:", JSON.stringify(meta));
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              const via = (v.via || []).map(x => typeof x === "string" ? x : (x.title || x.name || x.url)).join(" | ");
              console.log(JSON.stringify({name, severity:v.severity, direct:v.isDirect, range:v.range, via, fixAvailable:v.fixAvailable}));
            }
          '
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-production.json
          set -e
          node --input-type=commonjs -e '
            const report = require("/tmp/npm-audit-production.json");
            const meta = report.metadata?.vulnerabilities || {};
            console.log("Production audit totals:", JSON.stringify(meta));
            if ((meta.high || 0) + (meta.critical || 0) > 0) process.exit(1);
          '
      - name: Frontend verification
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit verified compatible lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile change was produced."
            exit 0
          fi
          git commit -m "fix(security): apply compatible npm audit lockfile fixes"
          git push origin HEAD:security/safe-npm-audit-fixes
