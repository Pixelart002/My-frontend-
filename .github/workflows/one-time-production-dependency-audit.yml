name: One-time frontend production dependency audit

on:
  push:
    branches:
      - security/frontend-production-dependency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependency tree
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-production.json
          audit_status=$?
          set -e
          node --input-type=commonjs -e '
            const report = require("/tmp/npm-audit-production.json");
            const meta = report.metadata?.vulnerabilities || {};
            console.log("Production dependency audit summary:", JSON.stringify(meta));
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              console.log(name + ": severity=" + v.severity + "; range=" + v.range + "; direct=" + v.isDirect);
            }
            if ((meta.high || 0) + (meta.critical || 0) > 0) process.exitCode = 1;
          '
