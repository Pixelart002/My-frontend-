<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <link
      rel="preload"
      as="style"
      href="/tailwind.css"
      fetchpriority="high"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="/tailwind.css" /></noscript>
    <style id="luviio-critical-css">
      *,*::before,*::after{box-sizing:border-box}
      html{min-width:0;-webkit-text-size-adjust:100%;background:#0d0f12}
      body{min-width:320px;min-height:100vh;margin:0;overflow-x:clip;background:#0d0f12;color:#f4f1eb;font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #root{min-width:0;min-height:100vh}
      img,svg,video,canvas{max-width:100%}
      img{display:block;height:auto}
      a{color:inherit;text-decoration:none}
      button,input,select,textarea{font:inherit}
      .store-main,.store-page-frame{min-width:0}
      .store-page-frame{width:100%;max-width:1240px;margin-inline:auto;padding-inline:clamp(14px,3vw,28px);padding-block-end:clamp(28px,5vw,64px)}
      .header{position:sticky;top:0;z-index:120;display:flex;align-items:center;height:68px;min-height:68px;padding-inline:14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(8,8,8,.94);color:#f4f1eb}
      .header-reference-inner{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:68px;min-width:0;padding-inline:0}
      .brand{min-width:0;color:#d9aa5b;font-family:Georgia,serif;font-size:28px;font-weight:500;line-height:1;letter-spacing:-.035em;white-space:nowrap}
      .nav-links,.search-form{display:none}
      .header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;margin-left:auto}
      .header-account-icon,.header-cart-icon,.menu-button{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
      .header-account-icon,.header-cart-icon{width:44px;height:44px;min-width:44px}
      .menu-button{width:44px;height:44px;min-width:44px;min-height:44px;border:1px solid #343c47;border-radius:10px;background:#15181d;color:#f4f1eb}
      main[aria-labelledby="home-title"]{min-width:0;overflow:hidden;background:#0d0f12;color:#f4f1eb}
      main[aria-labelledby="home-title"]>section:first-child{position:relative;isolation:isolate;min-width:0;min-height:680px;overflow:hidden;border-bottom:1px solid #343c47}
      main[aria-labelledby="home-title"]>section:first-child>div:first-child{position:absolute;inset:0;z-index:-20;background-image:url('/luviio-hero-background.webp');background-position:center;background-size:cover}
      main[aria-labelledby="home-title"]>section:first-child>div:nth-child(2),main[aria-labelledby="home-title"]>section:first-child>div:nth-child(3){position:absolute;inset:0;z-index:-10;pointer-events:none}
      main[aria-labelledby="home-title"]>section:first-child>div:last-child{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:2.5rem;width:100%;max-width:1280px;min-height:680px;margin-inline:auto;padding:80px 16px}
      main[aria-labelledby="home-title"] h1{max-width:11ch;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:3.5rem;font-weight:600;line-height:.92;letter-spacing:-.05em}
      main[aria-labelledby="home-title"] h1 span{color:#f0cf97}
      main[aria-labelledby="home-title"] p{max-width:68ch}
      main[aria-labelledby="home-title"] a{touch-action:manipulation}
      @media(min-width:640px){main[aria-labelledby="home-title"] h1{font-size:3.75rem}}
      @media(min-width:641px){main[aria-labelledby="home-title"]>section:first-child>div:last-child{padding-inline:24px}}
      @media(min-width:901px){
        .header{height:72px;min-height:72px;padding-inline:5vw}
        .header-reference-inner{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:28px;height:72px;padding-inline:0}
        .brand{font-size:35px}
        .nav-links{display:flex;align-items:center;justify-content:center;gap:32px;height:100%;white-space:nowrap}
        .search-form{display:flex;align-items:center;gap:8px;width:220px;min-width:0;height:38px;padding-inline:12px;border:1px solid rgba(255,255,255,.17);border-radius:999px;background:rgba(12,12,12,.72)}
        .search-form input{width:100%;min-width:0;border:0;background:transparent;color:#f4f1eb}
        .menu-button{display:none}
        main[aria-labelledby="home-title"]>section:first-child>div:last-child{padding:96px 32px}
      }
      @media(min-width:1024px){
        main[aria-labelledby="home-title"]>section:first-child>div:last-child{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;padding-inline:32px}
        main[aria-labelledby="home-title"] h1{font-size:6rem}
      }
      @media(max-width:640px){.search-form{display:none}}
    </style>
